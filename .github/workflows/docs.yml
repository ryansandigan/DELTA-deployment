# Builds the MkDocs Material site from mkdocs-material/ and publishes it to
# GitHub Pages with the native Pages artifact flow (no gh-pages branch, no
# `mkdocs gh-deploy`, no release). It never runs on its own: deployment is
# dispatched explicitly with `make mkdoc-deploy` (gh workflow run) against the
# already-pushed main branch. Pages must be set to "GitHub Actions" as its
# source in the repository settings (Settings -> Pages -> Build and deployment).
name: Deploy documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a run already deploying is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs-material/requirements.txt

      - name: Install MkDocs Material
        run: python -m pip install -r mkdocs-material/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site (strict)
        working-directory: mkdocs-material
        run: python -m mkdocs build --strict

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mkdocs-material/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
