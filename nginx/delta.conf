# =============================================================================
# DELTA - NGINX reverse proxy
#
# The whole ./nginx directory is mounted read-only over /etc/nginx/conf.d. That
# hides the image's own default.conf on purpose: it declares a default_server
# on port 80 too, and leaving it in place makes nginx exit with
# "a duplicate default server for 0.0.0.0:80".
#
# Logs are not redirected anywhere. The image links them to the container's
# stdout/stderr, so `docker compose logs nginx` shows both.
#
# HTTPS: see the clearly marked section at the bottom of this file.
#
# This file is the default, and it assumes nginx is the first thing the client
# reaches. Every forwarded value below is what THIS server observed, so nothing
# a client sends can influence it.
#
# If a TLS-terminating gateway, load balancer or WAF sits in front of this
# proxy, use ./delta-behind-tls-proxy.conf.example instead - see
# docs/deployment-options.md. Do not merge the two.
# =============================================================================

# WebSocket upgrades: "Connection: upgrade" only when the client asked for one,
# "Connection: close" otherwise. Sending a bare "upgrade" on every request
# breaks keep-alive to the backend. `map` belongs to the http context, and
# conf.d/*.conf is included from inside http { }, so this is where it goes.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ---------------------------------------------------------------------------
# HTTP. This is the default, and it is suitable for local testing only.
#
# DELTA marks its session cookies Secure. Browsers treat http://localhost as a
# secure context, so signing in works on localhost over plain HTTP - but the
# same deployment reached at a real hostname over plain HTTP will not keep
# anyone signed in. Any real deployment needs HTTPS, either here or at a proxy
# in front of this one.
# ---------------------------------------------------------------------------
server {
    listen      80 default_server;
    server_name _;

    # nginx defaults to 1 MB. DELTA accepts uploads up to 10 MB, and up to
    # 50 MB on one path. Without this, uploads fail with HTTP 413 before the
    # application ever sees them.
    client_max_body_size 64m;

    location / {
        # The Compose service name, never localhost: nginx and delta are
        # separate containers and find each other through Compose's DNS.
        proxy_pass http://delta:3000;

        # Required for keep-alive and for WebSocket upgrades to the backend.
        proxy_http_version 1.1;

        # DELTA reads these headers directly. They are not optional decoration.
        # Each one describes the request as THIS server saw it; no incoming
        # X-Forwarded-* value is trusted or passed through.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket upgrades. proxy_http_version 1.1 alone is not enough -
        # without these two the upgrade handshake never reaches DELTA.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Long uploads and report generation outlive the 60-second default.
        proxy_read_timeout 300s;
    }
}

# =============================================================================
# HTTPS - enabling TLS during a FIRST deployment
#
# These are preparation steps only. They change files; they start nothing.
#
#   1. Put your certificate and key in ./certs as delta.crt and delta.key.
#      The certificate file must contain the full chain (server certificate
#      first, then any intermediates).
#   2. DELETE the whole HTTP server block above - the two cannot both declare
#      default_server on port 80.
#   3. Uncomment both server blocks below.
#   4. In docker-compose.yml, uncomment the 443 port, the ./certs mount, and
#      the HTTPS healthcheck (and comment out the HTTP healthcheck).
#   5. Set PUBLIC_URL in .env to the https:// address.
#
# Then STOP and go back to your deployment guide. Do not start nginx here.
#
# Starting nginx publishes the site, and on a first deployment the built-in
# administrator account still has the password that ships in the public image.
# Your guide starts nginx at step 7, after step 6.3 has changed that password
# and verified the change. That ordering is the whole point of it.
#
# There is no certificate automation here.
#
# ---------------------------------------------------------------------------
# RENEWING a certificate on a deployment that is already live
#
# Different situation, and safe: the deployment is already bootstrapped and
# already published, so restarting the proxy exposes nothing new.
#
#   1. Replace delta.crt and delta.key in ./certs.
#   2. docker compose restart nginx
#   3. docker compose ps    - nginx should return to (healthy)
#
# ---------------------------------------------------------------------------
# If TLS is terminated by a proxy you already operate, do none of this - see
# docs/deployment-options.md, patterns C and D.
# =============================================================================

