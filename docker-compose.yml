# =============================================================================
# DELTA - reference deployment stack
#
# Runtime files: this file, .env, and nginx/delta.conf.
# All configuration lives in .env - see docs/configuration.md.
#
#   client  ->  nginx  ->  delta  ->  db
#
# Only nginx publishes a host port. DELTA (3000) and PostgreSQL (5432) are
# reachable only from inside this project's network.
#
# The db and nginx services are OPTIONAL. To run against an external database,
# or behind a proxy/load balancer you already operate, follow the documented
# edits in docs/deployment-options.md.
# =============================================================================

# The project name decides the real names of the volumes, containers and
# network below (delta_pgdata, delta-db-1, ...). It is pinned here rather than
# left to default to the directory name, so renaming or moving this directory
# cannot silently select a different, empty set of volumes.
#
# RUNNING MORE THAN ONE DELTA DEPLOYMENT ON ONE HOST: each one MUST set a
# distinct COMPOSE_PROJECT_NAME in its .env. Two deployments left on the same
# project name share containers and volumes and will corrupt each other.
# See docs/configuration.md.
name: ${COMPOSE_PROJECT_NAME:-delta}

# Docker's default logging driver has no size limit. These caps keep a
# long-lived deployment from filling the disk with container logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 + PostGIS.
  #
  # PostGIS is required, not optional: DELTA's schema begins with
  # CREATE EXTENSION IF NOT EXISTS pgcrypto / postgis. This image creates the
  # extensions as superuser at first initialisation, before DELTA connects, so
  # DELTA's own CREATE EXTENSION is a harmless no-op. Plain postgres:17 fails.
  #
  # The data directory must be mounted at /var/lib/postgresql/data. Mounting
  # /var/lib/postgresql instead does not survive container recreation.
  # ---------------------------------------------------------------------------
  db:
    image: ${DB_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  # ---------------------------------------------------------------------------
  # The DELTA application.
  #
  # Its command is never overridden. The image's own command initialises or
  # migrates the schema and then starts the application - that command IS the
  # migration mechanism (see docs/update.md).
  #
  # depends_on: service_healthy is required, not cosmetic. Without it the
  # container starts against a database that is not accepting connections yet,
  # exits, and Docker's restart backoff turns a seconds-long wait into minutes.
  #
  # Never mount anything over /delta itself - that hides the application baked
  # into the image. Only uploads and logs are mounted, at fixed paths.
  # ---------------------------------------------------------------------------
  delta:
    image: ${DELTA_IMAGE}
    # The published image is linux/amd64 only. On an arm64 host (Apple silicon,
    # arm64 Linux) uncomment this to run it under emulation - expect it to be
    # slow, and note this combination is not covered by any testing we have.
    #platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # .env is passed to the container as-is. This is what lets you add SMTP or
    # SSO settings by editing .env alone. The tradeoff: the container also
    # receives values it does not need, such as POSTGRES_PASSWORD.
    env_file:
      - .env
    environment:
      # Built from the POSTGRES_* values above, so the credentials the database
      # is created with and the ones DELTA uses cannot drift apart.
      #
      # EXTERNAL DATABASE (patterns B and D): replace this one line with
      #     DATABASE_URL: ${DATABASE_URL}
      # and set the full connection string in .env. See
      # docs/deployment-options.md - you are already editing this file for that
      # pattern, and an explicit swap is clearer than a hidden fallback.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Fixed container paths, not operator settings.
      NODE_ENV: production
      LOG_DIR: /delta/logs
    volumes:
      - uploads:/delta/uploads
      - logs:/delta/logs
    # The image ships neither curl nor wget and declares no healthcheck of its
    # own, so this probe uses Node's built-in fetch. start_period covers a cold
    # first start, which loads the full schema.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging: *logging

  # ---------------------------------------------------------------------------
  # NGINX - the only service with a published port.
  #
  # The whole ./nginx directory is mounted over /etc/nginx/conf.d, which
  # deliberately hides the image's own default.conf. Mounting just the one file
  # would leave default.conf in place and nginx would refuse to start with
  # "duplicate default server".
  #
  # Access and error logs go to the container's stdout/stderr, so they appear
  # in `docker compose logs nginx`.
  # ---------------------------------------------------------------------------
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    restart: unless-stopped
    depends_on:
      delta:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      # HTTPS: uncomment together with the TLS section of nginx/delta.conf.
      #- "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      # HTTPS: uncomment and place your certificate and key in ./certs.
      #- ./certs:/etc/nginx/certs:ro
    # The probe goes through the proxy to DELTA, so "healthy" means the whole
    # chain answers rather than just that nginx is running.
    #
    # The probe must target the scheme this deployment actually serves. With
    # the TLS blocks enabled, port 80 serves a redirect rather than content, so
    # an HTTP probe would report the container unhealthy while the site is
    # perfectly fine - this image's wget is BusyBox wget, which does not follow
    # redirects. Switch the two lines below together with the TLS blocks.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      #test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

# Named volumes, not bind mounts: they behave the same on Windows, Linux and
# macOS, and avoid the root-owned-directory problem a bind mount creates on
# Linux. Their real names are prefixed with the project name above.
# See docs/backup-restore.md for how to back them up.
volumes:
  pgdata:
  uploads:
  logs:
